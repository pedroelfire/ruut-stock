<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Brand mark: --primary square with a trend line. A static SVG cannot read CSS variables, so
       these are the light-theme token values (--primary #0E7C7B, --primary-foreground #FFFFFF). -->
  <rect width="32" height="32" rx="7" fill="#0E7C7B"/>
  <g transform="translate(6 6) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
    <polyline points="16 7 22 7 22 13"/>
  </g>
</svg>
